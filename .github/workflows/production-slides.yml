name: Slides-Production

# Per-LANGUAGE matrix split. The monolithic whole-site build OOMs on every
# available runner (ubuntu-latest 16GB killed at ~4min; macos-latest 7GB killed
# at ~51min; macos-13 retired). Each matrix job builds only one language (+en,
# the default content language that cannot be disabled), which fits easily in
# ubuntu-latest. Jobs sync additively to the slides/ prefix (NO --delete, so
# languages don't clobber each other).

on:
  repository_dispatch:
    types: [production-complete]
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout slides content (sparse)
        uses: actions/checkout@v4
        with:
          repository: Aspose/products.aspose.com
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            content/slides
          sparse-checkout-cone-mode: false

      - name: Build language matrix from content/slides/*
        id: set-matrix
        run: |
          # en is defaultContentLanguage and is rebuilt by every job, so it needs
          # no job of its own. An en-only job leaves exactly one language enabled,
          # and Hugo then writes en's URL set to public/sitemap.xml instead of a
          # sitemap index - the same S3 key every other job writes its index to.
          langs=$(ls -d content/slides/*/ | xargs -n1 basename | grep -vx en)
          json=$(printf '%s\n' $langs | jq -R . | jq -sc .)
          echo "matrix={\"language\":$json}" >> $GITHUB_OUTPUT

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CEPH_PROD_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CEPH_PROD_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ENDPOINT_URL: https://s3.dynabic.com

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout site repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: Aspose/products.aspose.com
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            configs
            content/slides
            layouts
            themes
            assets
            static
            data
            i18n
            package.json
            package-lock.json
            postcss.config.js
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.101.0'
          extended: true

      - name: Install Node.js dependencies
        run: npm install

      - name: Install PostCSS dependencies
        run: npm install -D autoprefixer postcss postcss-cli

      - name: Find and replace url param in frontmatter
        run: find . -type f -name '*.md' -exec sed -i 's/url:/url_ignore:/g' {} +

      # Build only this language (+en). en is defaultContentLanguage and cannot
      # be disabled, so it is included in every job; --size-only on sync makes the
      # repeated en upload a cheap no-op after the first job.
      - name: Generate config.json (disable all languages except en + ${{ matrix.language }})
        run: |
          set -euo pipefail
          TARGET="${{ matrix.language }}"
          all=$(ls -d content/slides/*/ | xargs -n1 basename)
          disable=$(for l in $all; do if [ "$l" != "en" ] && [ "$l" != "$TARGET" ]; then echo "$l"; fi; done | jq -R . | jq -sc .)
          # Every locale, including the ones this job disables. The sitemap index
          # is built from this param, so it lists all locales, not this job's two.
          every=$(printf '%s\n' $all | jq -R . | jq -sc .)
          printf '{"disableLanguages": %s, "params": {"sitemapLanguages": %s}}\n' "$disable" "$every" > config.json
          echo "Building language '$TARGET' (+en). config.json:"; cat config.json

      - name: Build Slides (${{ matrix.language }})
        run: hugo --config "configs/slides.toml","config.json" -c "content/slides" -b "https://products.aspose.com/slides" --cleanDestinationDir --minify

      - name: Force S3 path-style addressing for Ceph
        run: aws configure set default.s3.addressing_style path

      - name: Sync to Ceph S3 Bucket (additive - no --delete across languages)
        run: |
          set -euo pipefail
          echo "Deploying language ${{ matrix.language }} to Ceph S3 bucket..."
          test -n "${AWS_ENDPOINT_URL:-}" || (echo "AWS_ENDPOINT_URL is empty" && exit 1)

          aws s3 sync ./public/ s3://products-aspose-com/slides/ \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --size-only \
            --no-progress \
            --exclude ".gitignore" \
            --page-size 100 \
            --cli-read-timeout 300 \
            --cli-connect-timeout 60 \
            | tee /tmp/sync.log

      - name: Record what actually uploaded
        if: always()
        run: |
          set -uo pipefail
          mkdir -p changed
          out="changed/changed-${{ matrix.language }}.tsv"
          : > "$out"
          grep -E '^upload: ' /tmp/sync.log | sed 's/^upload: //' \
          | while read -r src _to dst; do
              key="${dst#s3://products-aspose-com/}"
              bytes="$(stat -c%s "$src")"
              case "$key" in
                */index.html)
                  # Two cache keys, not one: /slides/net/ and /slides/net/index.html
                  # are separate objects at the edge and a purge of one does not
                  # evict the other.
                  printf '%s\t%s\n' "https://products.aspose.com/${key%index.html}" "$bytes" >> "$out"
                  printf '%s\t%s\n' "https://products.aspose.com/$key"              "$bytes" >> "$out"
                  ;;
                *)
                  printf '%s\t%s\n' "https://products.aspose.com/$key" "$bytes" >> "$out"
                  ;;
              esac
            done
          echo "objects uploaded: $(grep -cE '^upload: ' /tmp/sync.log)"
          echo "purge URLs:       $(wc -l < "$out")"

      - name: Upload the changed-set manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changed-${{ matrix.language }}
          path: changed/
          if-no-files-found: warn

  purge:
    name: Purge the changed URLs and verify the edge serves the new bytes
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Collect every job's changed set
        uses: actions/download-artifact@v4
        with:
          path: changed
          pattern: changed-*
          merge-multiple: true

      - name: Purge per URL, then verify by byte length
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          MAX_PER_URL: "500"
          SAMPLE_SIZE: "50"
          SAMPLE_PASS_PCT: "95"
        run: |
          set -uo pipefail

          if [ -z "${BUNNY_API_KEY:-}" ]; then
            echo "::error title=CDN purge skipped::BUNNY_API_KEY is not set. /slides/ keeps serving cached pages for up to 30 days."
            exit 1
          fi

          cat changed/*.tsv 2>/dev/null | sort -u > all.tsv || true
          n=$(wc -l < all.tsv)
          echo "changed URLs across all languages: $n"

          # An empty changed set is a failure, not a no-op. aws s3 sync --size-only
          # uploads nothing when a fix is byte-length-identical, and that is the
          # single most expensive silent failure in this pipeline.
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing was uploaded::aws s3 sync --size-only moved 0 objects, so no change can have reached a reader. Force a byte-length delta and redeploy."
            exit 1
          fi

          edge() {  # url -> "code<TAB>bytes<TAB>cdn-cache<TAB>pop"
            curl -sS -o /dev/null -D - --max-time 30 -H 'Accept-Encoding: identity' \
                 -A 'slides-production/purge-canary' "$1" 2>/dev/null | tr -d '\r' \
            | awk 'BEGIN{c="000";l="";s="";p=""}
                   /^HTTP\//{c=$2}
                   tolower($1)=="content-length:"{l=$2}
                   tolower($1)=="cdn-cache:"{s=$2}
                   tolower($1)=="server:"{p=$2}
                   END{printf "%s\t%s\t%s\t%s", c, l, s, p}'
          }

          purge_one() {
            for attempt in 1 2 3; do
              code="$(curl -sS -G -o /dev/null -w '%{http_code}' --max-time 120 \
                        -H "X-Api-Key: $BUNNY_API_KEY" --data-urlencode "url=$1" \
                        'https://api.dynabic.com/bn/purge?async=false')" || code="000"
              case "$code" in
                2*)     echo "$code"; return 0 ;;
                5*|000) sleep $((5 * attempt)) ;;
                *)      echo "$code"; return 1 ;;
              esac
            done
            echo "$code"; return 1
          }

          # Canaries are drawn from what changed, one per class, so a class that
          # this deploy touched cannot go unobserved. Classes absent from the
          # changed set are absent from the canary list -- never substituted.
          html=$(cut -f1 all.tsv | grep -E '/$' || true)
          canaries="$( { echo "$html" | awk '{print gsub("/","/"), $0}' | sort -n  | head -1 | cut -d' ' -f2-
                         echo "$html" | awk '{print gsub("/","/"), $0}' | sort -rn | head -1 | cut -d' ' -f2-
                         echo "$html" | grep -E '^https://products\.aspose\.com/slides/[a-z]{2}(-[a-z]+)?/' | head -1
                         cut -f1 all.tsv | grep -E '/index\.md$'        | head -1
                         cut -f1 all.tsv | grep -E '/llms\.txt$'        | head -1
                         cut -f1 all.tsv | grep -E '/slides/(css|js)/'  | head -1
                         cut -f1 all.tsv | grep -E '/sitemap\.xml$'     | head -1
                       } | sed '/^$/d' | sort -u )"
          echo "canaries:"; echo "$canaries" | sed 's/^/  /'

          echo "--- before"
          for u in $canaries; do echo "  $(edge "$u")  $u"; done

          if [ "$n" -le "$MAX_PER_URL" ]; then
            targets="$(cut -f1 all.tsv)"
            mode="per-URL over the whole changed set"
          else
            targets="$(printf '%s\n' "$canaries"; cut -f1 all.tsv | shuf -n "$SAMPLE_SIZE")"
            mode="per-URL over canaries + ${SAMPLE_SIZE} sampled, plus one wildcard"
            purge_one 'https://products.aspose.com/slides/*' >/dev/null || true
          fi
          echo "purge mode: $mode"

          fail=0
          for u in $targets; do
            code="$(purge_one "$u")" || { echo "::warning::purge gateway returned $code for $u"; fail=$((fail+1)); }
          done
          echo "purge calls with a non-2xx answer: $fail"

          sleep 8

          echo "--- after"
          bad=""; checked=0; ok=0
          for u in $(printf '%s\n' $canaries $targets | sort -u); do
            want="$(awk -F'\t' -v u="$u" '$1==u{print $2; exit}' all.tsv)"
            [ -n "$want" ] || continue
            got="$(edge "$u")"
            code=$(printf '%s' "$got" | cut -f1); len=$(printf '%s' "$got" | cut -f2)
            checked=$((checked+1))
            if [ "$code" = "200" ] && [ "$len" = "$want" ]; then
              ok=$((ok+1))
            else
              bad="$bad $u(want=$want got=$code/$len)"
            fi
          done
          echo "verified $ok of $checked; edge PoP: $(edge 'https://products.aspose.com/slides/' | cut -f4)"

          # Every canary must be correct. The sample only has to clear a rate,
          # because a partial CDN purge is the observed failure, not a theory:
          # a previous wave measured 4.0% of a 300-response sample carrying the fix.
          for u in $canaries; do
            case " $bad " in *" $u("*)
              echo "::error title=CDN purge did NOT take effect::${u} is not serving the bytes this deploy produced. Do not date this change from this run."
              exit 1 ;;
            esac
          done

          pct=$(( 100 * ok / checked ))
          if [ "$pct" -lt "$SAMPLE_PASS_PCT" ]; then
            echo "::error title=CDN purge only partly took effect::${ok} of ${checked} URLs serve the new bytes (${pct}%, floor ${SAMPLE_PASS_PCT}%). Stale:${bad}"
            exit 1
          fi

          echo "Edge verified: ${ok} of ${checked} URLs serve the byte length this build produced."
          echo "NOTE: observed from one point of presence only. This is not a statement about the global edge."
