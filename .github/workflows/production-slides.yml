name: Slides-Production

# Per-LANGUAGE matrix split. The monolithic whole-site build OOMs on every
# available runner (ubuntu-latest 16GB killed at ~4min; macos-latest 7GB killed
# at ~51min; macos-13 retired). Each matrix job builds only one language (+en,
# the default content language that cannot be disabled), which fits easily in
# ubuntu-latest. Jobs sync additively to the slides/ prefix (NO --delete, so
# languages don't clobber each other).

on:
  repository_dispatch:
    types: [production-complete]
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout slides content (sparse)
        uses: actions/checkout@v4
        with:
          repository: Aspose/products.aspose.com
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            content/slides
          sparse-checkout-cone-mode: false

      - name: Build language matrix from content/slides/*
        id: set-matrix
        run: |
          # en is defaultContentLanguage and is rebuilt by every job, so it needs
          # no job of its own. An en-only job leaves exactly one language enabled,
          # and Hugo then writes en's URL set to public/sitemap.xml instead of a
          # sitemap index - the same S3 key every other job writes its index to.
          langs=$(ls -d content/slides/*/ | xargs -n1 basename | grep -vx en)
          json=$(printf '%s\n' $langs | jq -R . | jq -sc .)
          echo "matrix={\"language\":$json}" >> $GITHUB_OUTPUT

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CEPH_PROD_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CEPH_PROD_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ENDPOINT_URL: https://s3.dynabic.com

    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout site repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: Aspose/products.aspose.com
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            configs
            content/slides
            layouts
            themes
            assets
            static
            data
            i18n
            package.json
            package-lock.json
            postcss.config.js
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.101.0'
          extended: true

      - name: Install Node.js dependencies
        run: npm install

      - name: Install PostCSS dependencies
        run: npm install -D autoprefixer postcss postcss-cli

      - name: Find and replace url param in frontmatter
        run: find . -type f -name '*.md' -exec sed -i 's/url:/url_ignore:/g' {} +

      # Build only this language (+en). en is defaultContentLanguage and cannot
      # be disabled, so it is included in every job; --size-only on sync makes the
      # repeated en upload a cheap no-op after the first job.
      - name: Generate config.json (disable all languages except en + ${{ matrix.language }})
        run: |
          set -euo pipefail
          TARGET="${{ matrix.language }}"
          all=$(ls -d content/slides/*/ | xargs -n1 basename)
          disable=$(for l in $all; do if [ "$l" != "en" ] && [ "$l" != "$TARGET" ]; then echo "$l"; fi; done | jq -R . | jq -sc .)
          # Every locale, including the ones this job disables. The sitemap index
          # is built from this param, so it lists all locales, not this job's two.
          every=$(printf '%s\n' $all | jq -R . | jq -sc .)
          printf '{"disableLanguages": %s, "params": {"sitemapLanguages": %s}}\n' "$disable" "$every" > config.json
          echo "Building language '$TARGET' (+en). config.json:"; cat config.json

      - name: Build Slides (${{ matrix.language }})
        run: hugo --config "configs/slides.toml","config.json" -c "content/slides" -b "https://products.aspose.com/slides" --cleanDestinationDir --minify

      - name: Force S3 path-style addressing for Ceph
        run: aws configure set default.s3.addressing_style path

      - name: Sync to Ceph S3 Bucket (additive - no --delete across languages)
        run: |
          set -euo pipefail
          echo "Deploying language ${{ matrix.language }} to Ceph S3 bucket..."
          test -n "${AWS_ENDPOINT_URL:-}" || (echo "AWS_ENDPOINT_URL is empty" && exit 1)

          aws s3 sync ./public/ s3://products-aspose-com/slides/ \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --size-only \
            --exclude ".gitignore" \
            --page-size 100 \
            --cli-read-timeout 300 \
            --cli-connect-timeout 60

  purge:
    name: Purge BunnyCDN (/slides/*) and verify it took effect
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Purge with async=false, then verify by canary
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PURGE_TARGET: "https://products.aspose.com/slides/*"
        run: |
          set +e -u -o pipefail

          if [ -z "${BUNNY_API_KEY:-}" ]; then
            echo "::error title=CDN purge skipped::BUNNY_API_KEY is not set. /slides/ keeps serving cached pages for up to 30 days."
            exit 1
          fi

          # Canaries at several depths and in more than one language. A wildcard
          # purge has been observed to evict only the shallowest path while deeper
          # pages kept serving the previous HTML -- a single root canary is exactly
          # the probe a partial purge passes.
          CANARIES="
          https://products.aspose.com/slides/
          https://products.aspose.com/slides/net/
          https://products.aspose.com/slides/java/
          https://products.aspose.com/slides/python-net/
          https://products.aspose.com/slides/net/conversion/ppt-to-pdf/
          https://products.aspose.com/slides/ru/net/
          "

          STATE_DIR="$(mktemp -d)"
          key() { printf '%s' "$1" | tr -c 'a-zA-Z0-9' '_'; }
          cdn_state() {
            curl -sS -o /dev/null -D - --max-time 30 \
                 -A 'slides-production/purge-canary' "$1" 2>/dev/null \
              | tr -d '\r' | awk 'tolower($1)=="cdn-cache:"{s=$2} END{print s}'
          }

          # Warm first. A canary that is MISS before the purge is unobservable, and
          # a check with nothing to observe proves nothing while looking like a pass.
          for u in $CANARIES; do cdn_state "$u" >/dev/null; done
          sleep 3
          for u in $CANARIES; do
            s="$(cdn_state "$u")"
            printf '%s' "$s" > "$STATE_DIR/$(key "$u")"
            echo "before=$s  $u"
          done

          # async=false is the only mode ever observed to evict anything; async=true
          # answers HTTP 200 with the cache untouched. Retry on 5xx and on transport
          # failures -- this gateway degrades under load and has returned 504.
          code=""
          for attempt in 1 2 3; do
            code="$(curl -sS -G -o /tmp/purge.out -w '%{http_code}' --max-time 120 \
                      -H "X-Api-Key: $BUNNY_API_KEY" \
                      --data-urlencode "url=${PURGE_TARGET}" \
                      "https://api.dynabic.com/bn/purge?async=false")" || code="000"
            echo "purge attempt ${attempt}: HTTP ${code}"
            case "$code" in
              2*)      break ;;
              5*|000)  sleep $((5 * attempt)) ;;
              *)       break ;;
            esac
          done
          echo "gateway body: $(head -c 300 /tmp/purge.out 2>/dev/null)"

          case "$code" in
            2*) : ;;
            *)  echo "::error title=CDN purge failed::gateway returned HTTP ${code} for ${PURGE_TARGET} after 3 attempts. Nothing was evicted."
                exit 1 ;;
          esac

          sleep 8

          observable=0
          survivors=""
          for u in $CANARIES; do
            b="$(cat "$STATE_DIR/$(key "$u")")"
            a="$(cdn_state "$u")"
            echo "canary ${u}: ${b} -> ${a}"
            if [ "$b" = "HIT" ]; then
              observable=$((observable + 1))
              if [ "$a" = "HIT" ]; then survivors="${survivors} ${u}"; fi
            fi
          done

          if [ "$observable" -eq 0 ]; then
            echo "::error title=CDN purge UNVERIFIED::no canary was cached before the purge, so nothing was observed. HTTP ${code} from this gateway is not evidence of eviction."
            exit 1
          fi

          if [ -n "$survivors" ]; then
            echo "::error title=CDN purge did NOT take effect::gateway returned HTTP ${code}, $((observable - $(echo $survivors | wc -w))) of ${observable} cached canaries were evicted, but these are still served from cache:${survivors}. Users keep seeing the previous page; do not date this change from this run."
            exit 1
          fi

          echo "CDN purge verified: all ${observable} cached canaries went HIT -> MISS (gateway HTTP ${code})."
