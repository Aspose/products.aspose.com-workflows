name: Slides-Production

# Per-LANGUAGE matrix split. The monolithic whole-site build OOMs on every
# available runner (ubuntu-latest 16GB killed at ~4min; macos-latest 7GB killed
# at ~51min; macos-13 retired). Each matrix job builds only one language (+en,
# the default content language that cannot be disabled), which fits easily in
# ubuntu-latest. Jobs sync additively to the slides/ prefix (NO --delete, so
# languages don't clobber each other).

on:
  repository_dispatch:
    types: [production-complete]
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout slides content (sparse)
        uses: actions/checkout@v4
        with:
          repository: Aspose/products.aspose.com
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            content/slides
          sparse-checkout-cone-mode: false

      - name: Build language matrix from content/slides/*
        id: set-matrix
        run: |
          # en is defaultContentLanguage and is rebuilt by every job, so it needs
          # no job of its own. An en-only job leaves exactly one language enabled,
          # and Hugo then writes en's URL set to public/sitemap.xml instead of a
          # sitemap index - the same S3 key every other job writes its index to.
          langs=$(ls -d content/slides/*/ | xargs -n1 basename | grep -vx en)
          json=$(printf '%s\n' $langs | jq -R . | jq -sc .)
          echo "matrix={\"language\":$json}" >> $GITHUB_OUTPUT

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CEPH_PROD_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CEPH_PROD_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ENDPOINT_URL: https://s3.dynabic.com

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout site repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: Aspose/products.aspose.com
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            configs
            content/slides
            layouts
            themes
            assets
            static
            data
            i18n
            package.json
            package-lock.json
            postcss.config.js
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.101.0'
          extended: true

      - name: Install Node.js dependencies
        run: npm install

      - name: Install PostCSS dependencies
        run: npm install -D autoprefixer postcss postcss-cli

      - name: Find and replace url param in frontmatter
        run: find . -type f -name '*.md' -exec sed -i 's/url:/url_ignore:/g' {} +

      # Build only this language (+en). en is defaultContentLanguage and cannot
      # be disabled, so it is included in every job; --size-only on sync makes the
      # repeated en upload a cheap no-op after the first job.
      - name: Generate config.json (disable all languages except en + ${{ matrix.language }})
        run: |
          set -euo pipefail
          TARGET="${{ matrix.language }}"
          all=$(ls -d content/slides/*/ | xargs -n1 basename)
          disable=$(for l in $all; do if [ "$l" != "en" ] && [ "$l" != "$TARGET" ]; then echo "$l"; fi; done | jq -R . | jq -sc .)
          # Every locale, including the ones this job disables. The sitemap index
          # is built from this param, so it lists all locales, not this job's two.
          every=$(printf '%s\n' $all | jq -R . | jq -sc .)
          printf '{"disableLanguages": %s, "params": {"sitemapLanguages": %s}}\n' "$disable" "$every" > config.json
          echo "Building language '$TARGET' (+en). config.json:"; cat config.json

      - name: Build Slides (${{ matrix.language }})
        run: hugo --config "configs/slides.toml","config.json" -c "content/slides" -b "https://products.aspose.com/slides" --cleanDestinationDir --minify

      - name: Force S3 path-style addressing for Ceph
        run: aws configure set default.s3.addressing_style path

      - name: Sync to Ceph S3 Bucket (additive - no --delete across languages)
        run: |
          set -euo pipefail
          echo "Deploying language ${{ matrix.language }} to Ceph S3 bucket..."
          test -n "${AWS_ENDPOINT_URL:-}" || (echo "AWS_ENDPOINT_URL is empty" && exit 1)

          aws s3 sync ./public/ s3://products-aspose-com/slides/ \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --size-only \
            --no-progress \
            --exclude ".gitignore" \
            --page-size 100 \
            --cli-read-timeout 300 \
            --cli-connect-timeout 60 \
            | tee /tmp/sync.log

      # A second pass for sitemaps only, deliberately WITHOUT --size-only.
      #
      # The sync above compares byte length alone, and a sitemap whose only change is
      # its <lastmod> dates is the same length as the one already in the bucket. So the
      # sitemaps were never re-uploaded and their dates froze: the index was still
      # advertising a date from a month earlier while the pages it lists had been
      # rebuilt many times. The purge job's canary picker has always contained a
      # sitemap rule and has never had a sitemap to select, for the same reason.
      #
      # Default sync semantics compare size AND modification time, so a rebuilt file
      # wins on time even when the length is identical. That is exactly the comparison
      # this needs and it is why --size-only is omitted here rather than reproduced.
      #
      # Scoped to the index and this job's own language. Every job also builds en, so
      # en's sitemap is included and will be written once per job with identical bytes
      # -- last writer wins, content the same. That redundancy is accepted knowingly:
      # en has no matrix job of its own, so it has no other single owner, and leaving
      # it out would freeze the dates on the largest locale to fix the other 23.
      - name: Force the sitemaps to upload (their length does not change when their dates do)
        run: |
          set -euo pipefail
          aws s3 sync ./public/ s3://products-aspose-com/slides/ \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --no-progress \
            --exclude "*" \
            --include "sitemap.xml" \
            --include "en/sitemap.xml" \
            --include "${{ matrix.language }}/sitemap.xml" \
            --cli-read-timeout 300 \
            --cli-connect-timeout 60 \
            | tee -a /tmp/sync.log

      - name: Record what actually uploaded
        if: always()
        run: |
          set -uo pipefail
          mkdir -p changed
          out="changed/changed-${{ matrix.language }}.tsv"
          : > "$out"

          # An upload set can legitimately be empty: this job's language may have had nothing of its
          # own to send, and every shared object it would have sent may already have been uploaded by
          # a job that ran first. `grep` exits 1 on no match, and under `bash -e` with `pipefail` that
          # used to kill the step -- 14 of 23 jobs failed on one deploy that delivered correctly. An
          # empty result is a fact about this language, not an error; the aggregate emptiness check
          # belongs in the purge job, which can see every language at once.
          { grep -E '^upload: ' /tmp/sync.log || true; } | sed 's/^upload: //' \
          | while read -r src _to dst; do
              key="${dst#s3://products-aspose-com/}"
              bytes="$(stat -c%s "$src")"
              case "$key" in
                */index.html)
                  # Two cache keys, not one: /slides/net/ and /slides/net/index.html
                  # are separate objects at the edge and a purge of one does not
                  # evict the other.
                  printf '%s\t%s\n' "https://products.aspose.com/${key%index.html}" "$bytes" >> "$out"
                  printf '%s\t%s\n' "https://products.aspose.com/$key"              "$bytes" >> "$out"
                  ;;
                *)
                  printf '%s\t%s\n' "https://products.aspose.com/$key" "$bytes" >> "$out"
                  ;;
              esac
            done

          echo "objects uploaded: $({ grep -cE '^upload: ' /tmp/sync.log || true; })"
          echo "purge URLs:       $(wc -l < "$out")"

      - name: Upload the changed-set manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changed-${{ matrix.language }}
          path: changed/
          if-no-files-found: warn

  purge:
    name: Purge the changed URLs and verify the edge serves the new bytes
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Collect every job's changed set
        uses: actions/download-artifact@v4
        with:
          path: changed
          pattern: changed-*
          merge-multiple: true

      - name: Purge per URL, then verify by byte length
        timeout-minutes: 330
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PURGE_PARALLEL: "24"
          SAMPLE_SIZE: "50"
          SAMPLE_PASS_PCT: "95"
          SETTLE_SECONDS: "25"
          HARD_CAP: "200000"
        run: |
          set -uo pipefail

          if [ -z "${BUNNY_API_KEY:-}" ]; then
            echo "::error title=CDN purge skipped::BUNNY_API_KEY is not set. /slides/ keeps serving cached pages for up to 30 days."
            exit 1
          fi

          cat changed/*.tsv 2>/dev/null | sort -u > all.tsv || true
          n=$(wc -l < all.tsv)
          echo "changed URLs across all languages: $n"

          # An empty changed set is a failure HERE, where every language is visible at once: it means
          # aws s3 sync --size-only moved nothing anywhere, and a byte-length-identical fix reached no
          # reader. A single language having nothing to upload is normal and is not an error -- that
          # check does not belong in the per-language job.
          if [ "$n" -eq 0 ]; then
            echo "::error title=Nothing was uploaded::aws s3 sync --size-only moved 0 objects, so no change can have reached a reader. Force a byte-length delta and redeploy."
            exit 1
          fi

          if [ "$n" -gt "$HARD_CAP" ]; then
            echo "::error title=Changed set above the purge cap::${n} URLs exceeds HARD_CAP=${HARD_CAP}. Purging per URL would exceed this job's budget, and the wildcard form does not evict. Split the deploy or raise the cap deliberately."
            exit 1
          fi

          edge() {  # url -> "code<TAB>bytes<TAB>cdn-cache<TAB>pop"
            curl -sS -o /dev/null -D - --max-time 30 -H 'Accept-Encoding: identity' \
                 -A 'slides-production/purge-canary' "$1" 2>/dev/null | tr -d '\r' \
            | awk 'BEGIN{c="000";l="";s="";p=""}
                   /^HTTP\//{c=$2}
                   tolower($1)=="content-length:"{l=$2}
                   tolower($1)=="cdn-cache:"{s=$2}
                   tolower($1)=="server:"{p=$2}
                   END{printf "%s\t%s\t%s\t%s", c, l, s, p}'
          }

          # Purge one exact URL. The wildcard form is NOT used anywhere in this job: measured against
          # the live zone on 2026-08-21 with a valid key, `/slides/*`, `/slides/net/*` and
          # `/slides/net/conversion/*` each returned HTTP 200 and left CDN-CachedAt untouched, while an
          # exact-URL purge of the same object evicted it. A wildcard call is indistinguishable from a
          # successful one and evicts nothing, so relying on it left ~134k URLs stale while this job
          # reported success.
          cat > /tmp/purge_one.sh <<'PURGE'
          #!/usr/bin/env bash
          u="$1"
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -G -o /dev/null -w '%{http_code}' --max-time 120 \
                      -H "X-Api-Key: $BUNNY_API_KEY" --data-urlencode "url=$u" \
                      'https://api.dynabic.com/bn/purge?async=false')" || code="000"
            case "$code" in
              2*)     exit 0 ;;
              429|5*|000) sleep $(( attempt * attempt * 2 )) ;;
              *)      echo "$code $u" >> /tmp/purge_fail.txt; exit 1 ;;
            esac
          done
          echo "$code $u" >> /tmp/purge_fail.txt
          exit 1
          PURGE
          chmod +x /tmp/purge_one.sh

          # One canary per class that this deploy actually touched. A class the deploy did not touch
          # has no canary and that is not an error: `grep` exits 1 on no match, and this used to run
          # inside a pipeline whose failure `pipefail` propagated into an assignment that `bash -e`
          # then treated as fatal -- a deploy that changed no sitemap and no llms.txt killed the step
          # before a single URL was purged. Each probe is guarded individually.
          pick() { cut -f1 all.tsv | grep -E "$1" 2>/dev/null | head -1 || true; }
          html=$(cut -f1 all.tsv | grep -E '/$' 2>/dev/null || true)
          deepest() { [ -n "$html" ] && printf '%s\n' "$html" | awk '{print gsub("/","/"), $0}' | sort $1 | head -1 | cut -d' ' -f2- || true; }
          canaries="$( { deepest -n
                         deepest -rn
                         [ -n "$html" ] && printf '%s\n' "$html" | grep -E '^https://products\.aspose\.com/slides/[a-z]{2}(-[a-z]+)?/' 2>/dev/null | head -1 || true
                         pick '/index\.md$'
                         pick '/llms\.txt$'
                         pick '/slides/(css|js)/'
                         pick '/sitemap\.xml$'
                       } | sed '/^$/d' | sort -u )"
          echo "canaries:"; printf '%s\n' "$canaries" | sed 's/^/  /'

          echo "--- before"
          for u in $canaries; do echo "  $(edge "$u")  $u"; done

          # Always per URL, over the whole changed set. There is no cheaper mechanism that works.
          : > /tmp/purge_fail.txt
          # `|| true` is load-bearing: xargs exits 123 when ANY child exits non-zero, and under
          # `bash -e` that kills the step before the failure count below is ever read -- which is the
          # whole point of collecting failures in a file rather than letting one abort the run.
          # Measured: a deploy with 3,024 changed URLs died on exit 123 having purged most of them
          # and verified none of them.
          cut -f1 all.tsv | xargs -r -P "$PURGE_PARALLEL" -n 1 /tmp/purge_one.sh || true
          fail=$(wc -l < /tmp/purge_fail.txt)
          echo "purge mode: per-URL over the whole changed set, ${PURGE_PARALLEL} at a time"
          echo "purge calls that never returned 2xx: $fail"
          [ "$fail" -gt 0 ] && head -20 /tmp/purge_fail.txt | sed 's/^/  /'
          if [ "$fail" -ge "$n" ]; then
            echo "::error title=Every purge call failed::${fail} of ${n} calls never returned 2xx. The gateway or the key is the problem, not the cache."
            exit 1
          fi

          # Eviction is eventually consistent. Measured: 6 s after a successful purge the old object
          # was still being served, 15 s after it was not. The previous 8 s sat inside that window and
          # could read a correct purge as a failure.
          sleep "$SETTLE_SECONDS"

          verify() {  # -> writes $bad, $checked, $ok
            bad=""; checked=0; ok=0
            for u in $1; do
              want="$(awk -F'\t' -v u="$u" '$1==u{print $2; exit}' all.tsv)"
              [ -n "$want" ] || continue
              got="$(edge "$u")"
              code=$(printf '%s' "$got" | cut -f1); len=$(printf '%s' "$got" | cut -f2)
              checked=$((checked+1))
              if [ "$code" = "200" ] && [ "$len" = "$want" ]; then ok=$((ok+1)); else bad="$bad $u"; fi
            done
          }

          sample="$(cut -f1 all.tsv | shuf -n "$SAMPLE_SIZE")"
          watch="$(printf '%s\n' $canaries $sample | sed '/^$/d' | sort -u)"

          echo "--- after"
          verify "$watch"
          echo "verified $ok of $checked; edge PoP: $(edge 'https://products.aspose.com/slides/' | cut -f4)"

          # One purge does not always clear every cache node: several URLs needed a second call before
          # they served the new bytes consistently. Re-purge what is still wrong and look again, rather
          # than failing on the first read.
          if [ -n "$bad" ]; then
            echo "--- re-purging $(printf '%s\n' $bad | wc -w) URLs that were still stale"
            printf '%s\n' $bad | xargs -r -P "$PURGE_PARALLEL" -n 1 /tmp/purge_one.sh || true
            sleep "$SETTLE_SECONDS"
            verify "$watch"
            echo "after the second pass: verified $ok of $checked"
          fi

          for u in $canaries; do
            case " $bad " in *" $u "*)
              echo "::error title=CDN purge did NOT take effect::${u} is not serving the bytes this deploy produced. Do not date this change from this run."
              exit 1 ;;
            esac
          done

          pct=$(( 100 * ok / checked ))
          if [ "$pct" -lt "$SAMPLE_PASS_PCT" ]; then
            echo "::error title=CDN purge only partly took effect::${ok} of ${checked} URLs serve the new bytes (${pct}%, floor ${SAMPLE_PASS_PCT}%). Stale:${bad}"
            exit 1
          fi

          echo "Edge verified: ${ok} of ${checked} URLs serve the byte length this build produced."
          echo "NOTE: observed from one point of presence only. This is not a statement about the global edge."
