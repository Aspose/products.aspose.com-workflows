name: Slides-Production

# Per-LANGUAGE matrix split. The monolithic whole-site build OOMs on every
# available runner (ubuntu-latest 16GB killed at ~4min; macos-latest 7GB killed
# at ~51min; macos-13 retired). Each matrix job builds only one language (+en,
# the default content language that cannot be disabled), which fits easily in
# ubuntu-latest. Jobs sync additively to the slides/ prefix (NO --delete, so
# languages don't clobber each other).

on:
  repository_dispatch:
    types: [production-complete]
  workflow_dispatch:
    inputs:
      purge_run_id:
        description: "Purge only: the run ID whose uploaded URLs to purge again. Skips build and upload."
        required: false
        default: ""

jobs:
  discover:
    if: ${{ !inputs.purge_run_id }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      source_sha: ${{ steps.set-matrix.outputs.source_sha }}
      languages: ${{ steps.set-matrix.outputs.languages }}
      all_languages: ${{ steps.set-matrix.outputs.all_languages }}
    steps:
      - name: Checkout slides content (sparse)
        uses: actions/checkout@v4
        with:
          repository: Aspose/products.aspose.com
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            content/slides
          sparse-checkout-cone-mode: false

      - name: Build language matrix from content/slides/*
        id: set-matrix
        run: |
          set -euo pipefail
          # Pin every build to one source revision. de owns English/shared uploads.
          test -d content/slides/de
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          all=$(ls -d content/slides/*/ | xargs -n1 basename | sort)
          all_json=$(printf '%s\n' $all | jq -R . | jq -sc .)
          echo "all_languages=$all_json" >> "$GITHUB_OUTPUT"
          # en is defaultContentLanguage and is rebuilt by every job, so it needs
          # no job of its own. An en-only job leaves exactly one language enabled,
          # and Hugo then writes en's URL set to public/sitemap.xml instead of a
          # sitemap index - the same S3 key every other job writes its index to.
          langs=$(ls -d content/slides/*/ | xargs -n1 basename | grep -vx en)
          json=$(printf '%s\n' $langs | jq -R . | jq -sc .)
          echo "matrix={\"language\":$json}" >> $GITHUB_OUTPUT
          echo "languages=$json" >> "$GITHUB_OUTPUT"

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CEPH_PROD_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CEPH_PROD_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ENDPOINT_URL: https://s3.dynabic.com

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout the pinned site revision (sparse)
        uses: actions/checkout@v4
        with:
          repository: Aspose/products.aspose.com
          ref: ${{ needs.discover.outputs.source_sha }}
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            configs
            content/slides
            layouts
            themes
            assets
            static
            data
            i18n
            package.json
            package-lock.json
            postcss.config.js
          sparse-checkout-cone-mode: false

      - name: Checkout pipeline helpers from this workflow revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: pipeline-tools
          sparse-checkout: |
            .github/scripts
            .github/tests
            .github/workflows
          persist-credentials: false

      - name: Test pipeline safeguards
        run: python3 -m unittest discover -s pipeline-tools/.github/tests -p 'test_slides*.py'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.101.0'
          extended: true

      - name: Install Node.js dependencies
        run: npm install

      - name: Install PostCSS dependencies
        run: npm install -D autoprefixer postcss postcss-cli

      - name: Find and replace url param in frontmatter
        run: find . -type f -name '*.md' -exec sed -i 's/url:/url_ignore:/g' {} +

      # Every job builds English for a complete SHA256 agreement check.
      # Only de publishes English/shared keys; other jobs publish their locale.
      - name: Generate config.json (disable all languages except en + ${{ matrix.language }})
        run: |
          set -euo pipefail
          TARGET="${{ matrix.language }}"
          all=$(ls -d content/slides/*/ | xargs -n1 basename)
          disable=$(for l in $all; do if [ "$l" != "en" ] && [ "$l" != "$TARGET" ]; then echo "$l"; fi; done | jq -R . | jq -sc .)
          # Every locale, including the ones this job disables. The sitemap index
          # is built from this param, so it lists all locales, not this job's two.
          every=$(printf '%s\n' $all | jq -R . | jq -sc .)
          printf '{"disableLanguages": %s, "params": {"sitemapLanguages": %s}}\n' "$disable" "$every" > config.json
          echo "Building language '$TARGET' (+en). config.json:"; cat config.json

      - name: Build Slides (${{ matrix.language }})
        run: hugo --config "configs/slides.toml","config.json" -c "content/slides" -b "https://products.aspose.com/slides" --cleanDestinationDir --minify

      - name: Record every English/shared generated byte
        env:
          TARGET_LANGUAGE: ${{ matrix.language }}
          ALL_LANGUAGES: ${{ needs.discover.outputs.all_languages }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
        run: |
          python3 pipeline-tools/.github/scripts/slides-production.py snapshot \
            --root public --language "$TARGET_LANGUAGE" --languages "$ALL_LANGUAGES" \
            --source-sha "$SOURCE_SHA" --output "english/english-$TARGET_LANGUAGE.json"

      - name: Upload English/shared SHA256 inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-${{ matrix.language }}
          path: english/
          if-no-files-found: warn

      - name: Force S3 path-style addressing for Ceph
        run: aws configure set default.s3.addressing_style path

      - name: Sync to Ceph S3 Bucket (additive - no --delete across languages)
        run: |
          set -euo pipefail
          echo "Deploying language ${{ matrix.language }} to Ceph S3 bucket..."
          test -n "${AWS_ENDPOINT_URL:-}" || (echo "AWS_ENDPOINT_URL is empty" && exit 1)

          # One writer for English/shared keys. No language can overwrite another.
          source="./public/${{ matrix.language }}/"
          target="s3://products-aspose-com/slides/${{ matrix.language }}/"
          if [ "${{ matrix.language }}" = "de" ]; then
            source="./public/"
            target="s3://products-aspose-com/slides/"
          fi
          test -d "$source"
          aws s3 sync "$source" "$target" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --size-only \
            --no-progress \
            --exclude ".gitignore" \
            --page-size 100 \
            --cli-read-timeout 300 \
            --cli-connect-timeout 60 \
            | tee /tmp/sync.log

      # Same-length sitemap dates must upload. Only de owns root/en sitemaps;
      # every other job writes exactly its own locale sitemap.
      - name: Force current sitemap dates to upload
        run: |
          set -euo pipefail
          includes=(--include "${{ matrix.language }}/sitemap.xml")
          if [ "${{ matrix.language }}" = "de" ]; then
            includes+=(--include "sitemap.xml" --include "en/sitemap.xml")
          fi
          aws s3 sync ./public/ s3://products-aspose-com/slides/ \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --no-progress --exclude "*" "${includes[@]}" \
            --cli-read-timeout 300 --cli-connect-timeout 60 \
            | tee -a /tmp/sync.log

      - name: Record what actually uploaded
        if: always()
        run: |
          set -uo pipefail
          mkdir -p changed
          out="changed/changed-${{ matrix.language }}.tsv"
          : > "$out"

          # An upload set can legitimately be empty: this job's language may have had nothing of its
          # own to send. `grep` exits 1 on no match, and under `bash -e` with `pipefail` that
          # used to kill the step -- 14 of 23 jobs failed on one deploy that delivered correctly. An
          # empty result is a fact about this language, not an error; the aggregate emptiness check
          # belongs in the purge job, which can see every language at once.
          { grep -E '^upload: ' /tmp/sync.log || true; } | sed 's/^upload: //' \
          | while read -r src _to dst; do
              key="${dst#s3://products-aspose-com/}"
              bytes="$(stat -c%s "$src")"
              case "$key" in
                */index.html)
                  # Two cache keys, not one: /slides/net/ and /slides/net/index.html
                  # are separate objects at the edge and a purge of one does not
                  # evict the other.
                  printf '%s\t%s\n' "https://products.aspose.com/${key%index.html}" "$bytes" >> "$out"
                  printf '%s\t%s\n' "https://products.aspose.com/$key"              "$bytes" >> "$out"
                  ;;
                *)
                  printf '%s\t%s\n' "https://products.aspose.com/$key" "$bytes" >> "$out"
                  ;;
              esac
            done

          echo "objects uploaded: $({ grep -cE '^upload: ' /tmp/sync.log || true; })"
          echo "purge URLs:       $(wc -l < "$out")"

      - name: Upload the changed-set manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changed-${{ matrix.language }}
          path: changed/
          if-no-files-found: warn

  plan:
    name: Collect the changed URLs and split them into purge shards
    needs: [discover, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      shards: ${{ steps.split.outputs.shards }}
    steps:
      - name: Checkout pipeline helpers from this workflow revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: pipeline-tools
          sparse-checkout: |
            .github/scripts
            .github/tests
            .github/workflows
          persist-credentials: false

      - name: Collect every job's changed set
        if: ${{ !inputs.purge_run_id }}
        uses: actions/download-artifact@v4
        with:
          path: changed
          pattern: changed-*
          merge-multiple: true

      - name: Collect the changed set of run ${{ inputs.purge_run_id }}
        if: ${{ inputs.purge_run_id }}
        uses: actions/download-artifact@v4
        with:
          path: changed
          pattern: changed-*
          merge-multiple: true
          run-id: ${{ inputs.purge_run_id }}
          github-token: ${{ github.token }}

      - name: Collect every English/shared SHA256 inventory
        if: ${{ !inputs.purge_run_id }}
        uses: actions/download-artifact@v4
        with:
          path: english
          pattern: english-*
          merge-multiple: true

      - name: Require identical English/shared output in every language build
        if: ${{ !inputs.purge_run_id }}
        env:
          LANGUAGES: ${{ needs.discover.outputs.languages }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
        run: |
          python3 pipeline-tools/.github/scripts/slides-production.py compare \
            --manifests english --languages "$LANGUAGES" --source-sha "$SOURCE_SHA"

      - name: Split the changed set and read the canaries before the purge
        id: split
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PURGE_RUN_ID: ${{ inputs.purge_run_id }}
          SHARD_SIZE: "10000"
        run: |
          set -uo pipefail

          if [ -z "${BUNNY_API_KEY:-}" ]; then
            echo "::error title=CDN purge skipped::BUNNY_API_KEY is not set. /slides/ keeps serving cached pages for up to 30 days."
            exit 1
          fi

          python3 pipeline-tools/.github/scripts/slides-production.py plan \
            --changed changed --output plan --shard-size "$SHARD_SIZE" \
            --github-output "$GITHUB_OUTPUT" || exit 1

          cat > plan/edge.sh <<'EDGE'
          #!/usr/bin/env bash
          curl -sS -o /dev/null -D - --max-time 30 -H 'Accept-Encoding: identity' \
               -A 'slides-production/purge-canary' "$1" 2>/dev/null | tr -d '\r' \
          | awk 'BEGIN{c="000";l="";s="";p=""}
                 /^HTTP\//{c=$2}
                 tolower($1)=="content-length:"{l=$2}
                 tolower($1)=="cdn-cache:"{s=$2}
                 tolower($1)=="server:"{p=$2}
                 END{printf "%s\t%s\t%s\t%s", c, l, s, p}'
          EDGE

          # Purge one exact URL. The wildcard form is NOT used anywhere in this job: measured against
          # the live zone on 2026-08-21 with a valid key, `/slides/*`, `/slides/net/*` and
          # `/slides/net/conversion/*` each returned HTTP 200 and left CDN-CachedAt untouched, while an
          # exact-URL purge of the same object evicted it. A wildcard call is indistinguishable from a
          # successful one and evicts nothing, so relying on it left ~134k URLs stale while this job
          # reported success.
          cat > plan/purge_one.sh <<'PURGE'
          #!/usr/bin/env bash
          u="$1"
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -G -o /dev/null -w '%{http_code}' --max-time 120 \
                      -H "X-Api-Key: $BUNNY_API_KEY" --data-urlencode "url=$u" \
                      'https://api.dynabic.com/bn/purge?async=false')" || code="000"
            case "$code" in
              2*)     echo "$u" >> "${PURGED_LOG:-/dev/null}"; exit 0 ;;
              429|5*|000) sleep $(( attempt * attempt * 2 )) ;;
              *)      echo "$code $u" >> /tmp/purge_fail.txt; exit 1 ;;
            esac
          done
          echo "$code $u" >> /tmp/purge_fail.txt
          exit 1
          PURGE

          echo "canaries:"; sed 's/^/  /' plan/canaries.txt

          echo "--- before"
          while read -r u; do echo "  $(bash plan/edge.sh "$u")  $u"; done < plan/canaries.txt

      - name: Upload the purge plan
        uses: actions/upload-artifact@v4
        with:
          name: purge-plan
          path: plan/

  purge:
    name: Purge shard ${{ matrix.shard }}
    needs: plan
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Download the purge plan
        uses: actions/download-artifact@v4
        with:
          name: purge-plan
          path: plan
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Download what earlier attempts of this shard purged
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: done
          pattern: purged-${{ matrix.shard }}-*
          merge-multiple: true
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Purge per URL
        timeout-minutes: 330
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PURGE_PARALLEL: "12"
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          mkdir -p purged
          sort -u "plan/shards/${SHARD}.txt" > /tmp/shard.txt
          cat done/*.txt 2>/dev/null | sort -u > /tmp/done.txt || true
          comm -23 /tmp/shard.txt /tmp/done.txt > /tmp/todo.txt
          n=$(wc -l < /tmp/todo.txt)
          echo "shard ${SHARD}: $(wc -l < /tmp/shard.txt) URLs, $(comm -12 /tmp/shard.txt /tmp/done.txt | wc -l) purged by an earlier attempt, $n to purge"
          [ "$n" -eq 0 ] && exit 0

          : > /tmp/purge_fail.txt
          # `|| true` is load-bearing: xargs exits 123 when ANY child exits non-zero, and under
          # `bash -e` that kills the step before the failure count below is ever read -- which is the
          # whole point of collecting failures in a file rather than letting one abort the run.
          # Measured: a deploy with 3,024 changed URLs died on exit 123 having purged most of them
          # and verified none of them.
          PURGED_LOG="$PWD/purged/purged.txt" xargs -r -P "$PURGE_PARALLEL" -n 1 bash plan/purge_one.sh < /tmp/todo.txt || true
          fail=$(wc -l < /tmp/purge_fail.txt)
          echo "purge mode: per-URL, ${PURGE_PARALLEL} at a time"
          echo "purge calls that never returned 2xx: $fail"
          [ "$fail" -gt 0 ] && head -20 /tmp/purge_fail.txt | sed 's/^/  /'
          if [ "$fail" -ge "$n" ]; then
            echo "::error title=Every purge call failed::${fail} of ${n} calls never returned 2xx. The gateway or the key is the problem, not the cache."
            exit 1
          fi

      - name: Upload what this attempt purged
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purged-${{ matrix.shard }}-${{ github.run_attempt }}
          path: purged/
          if-no-files-found: ignore

  verify:
    name: Verify the edge serves the new bytes
    needs: [plan, purge]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout pipeline helpers from this workflow revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: pipeline-tools
          sparse-checkout: |
            .github/scripts
            .github/tests
            .github/workflows
          persist-credentials: false

      - name: Download the purge plan
        uses: actions/download-artifact@v4
        with:
          name: purge-plan
          path: plan
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify by byte length
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PURGE_PARALLEL: "24"
          SAMPLE_SIZE: "50"
          SAMPLE_PASS_PCT: "95"
          SETTLE_SECONDS: "25"
        run: |
          set -uo pipefail
          : > /tmp/purge_fail.txt
          status=0
          python3 pipeline-tools/.github/scripts/slides-production.py verify \
            --plan plan --report edge-verification --sample-size "$SAMPLE_SIZE" \
            --floor "$SAMPLE_PASS_PCT" --settle-seconds "$SETTLE_SECONDS" \
            --parallel "$PURGE_PARALLEL" || status=$?
          if [ "${{ needs.purge.result }}" != "success" ]; then
            echo "::error::Some purge shards did not finish. Re-run failed jobs; completed URLs are retained."
            status=1
          fi
          echo "Observed from one point of presence only."
          exit "$status"

      - name: Retain sampled URLs and every observed status and byte length
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-verification-${{ github.run_attempt }}
          path: edge-verification/
          if-no-files-found: warn

