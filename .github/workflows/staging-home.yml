name: Home-Staging

on:
  repository_dispatch:
    types: [staging-complete]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout theme repo
      uses: actions/checkout@main
      with:
          repository: Aspose/products.aspose.com
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
          hugo-version: '0.110.0'
          extended: true
    - name: Install autoprefixer
      run:  npm install -D --save autoprefixer
    - name: Install postcss-cli
      run:  npm install -D --save postcss-cli
    - name: Find and replace url param in frontmatter
      uses: jacobtomlinson/gha-find-replace@v2
      with:
        find: "url:"
        replace: "url_ignore:"
        include: "_index.md"
    - name: Find and replace domain name
      uses: jacobtomlinson/gha-find-replace@v2
      with:
        find: "products.aspose.com"
        replace: "products-qa.aspose.com"
        include: "_index.md"
    - name: Find and replace image url domain
      uses: jacobtomlinson/gha-find-replace@v2
      with:
        find: "logoImageSrc=\"https://www.aspose.cloud/"
        replace: "logoImageSrc=\"https://cms.admin.containerize.com/"
        include: "_index.md"

    - name: Build Home
      run: hugo --config "configs/home.toml" -b "https://products-qa.aspose.com" --cleanDestinationDir --minify

    - name: Prepare public folder
      run: mv /home/runner/work/products.aspose.com-workflows/products.aspose.com-workflows/home-ru.sitemap public/ru-sitemaps.xml;

    # The old AWS bucket (s3://products-qa.aspose.com, us-west-2) no longer exists
    # (hugo deploy -> NoSuchBucket). QA is served from a separate Ceph cluster, in a
    # bucket named with hyphens (products-qa-aspose-com), not the dotted domain.
    # No --delete: the QA bucket is shared with other families.
    # NOTE: the public data endpoint for GitHub-hosted runners is s3-qa.dynabic.com.
    # The admin hostname (s3-admin-qa.dynabic.com) only resolves over VPN and is not
    # reachable here, so it must not be used for this step.
    # NOTE: when Ceph rejects a request with an empty error message, aws-cli 2.39
    # crashes with "'NoneType' is not a container or iterable".
    - name: Sync to Ceph QA bucket
      run: |
        set -euo pipefail
        aws s3 sync ./public/ s3://products-qa-aspose-com/ \
          --endpoint-url "$AWS_ENDPOINT_URL" \
          --acl public-read
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.SMALLIZE_CEPH_QA_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.SMALLIZE_CEPH_QA_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        AWS_EC2_METADATA_DISABLED: "true"
        AWS_ENDPOINT_URL: https://s3-qa.dynabic.com

    - name: Purge BunnyCDN
      if: success()
      run: |
        curl -siG \
          -H "X-Api-Key: ${{ secrets.BUNNY_API_KEY }}" \
          --data-urlencode "url=https://products-qa.aspose.com" \
          "https://api.dynabic.com/bn/purge?async=true" || true
