name: Home-Staging

on:
  repository_dispatch:
    types: [staging-complete]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout theme repo
      uses: actions/checkout@main
      with:
          repository: Aspose/products.aspose.com
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 0
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
          hugo-version: '0.110.0'
          extended: true
    - name: Install autoprefixer
      run:  npm install -D --save autoprefixer
    - name: Install postcss-cli
      run:  npm install -D --save postcss-cli
    - name: Find and replace url param in frontmatter
      uses: jacobtomlinson/gha-find-replace@v2
      with:
        find: "url:"
        replace: "url_ignore:"
        include: "_index.md"
    - name: Find and replace domain name
      uses: jacobtomlinson/gha-find-replace@v2
      with:
        find: "products.aspose.com"
        replace: "products-qa.aspose.com"
        include: "_index.md"
    - name: Find and replace image url domain
      uses: jacobtomlinson/gha-find-replace@v2
      with:
        find: "logoImageSrc=\"https://www.aspose.cloud/"
        replace: "logoImageSrc=\"https://cms.admin.containerize.com/"
        include: "_index.md"

    - name: Build Home
      run: hugo --config "configs/home.toml" -b "https://products-qa.aspose.com" --cleanDestinationDir --minify

    - name: Prepare public folder
      run: mv /home/runner/work/products.aspose.com-workflows/products.aspose.com-workflows/home-ru.sitemap public/ru-sitemaps.xml;

    # The old AWS bucket (s3://products-qa.aspose.com, us-west-2) no longer exists
    # (hugo deploy -> NoSuchBucket). QA is served from Ceph; same method as
    # production-home.yml. No --delete: the QA bucket is shared with other families.
    # Note: if Ceph rejects the credentials (InvalidAccessKeyId, empty message),
    # aws-cli 2.39 crashes with "'NoneType' is not a container or iterable".
    - name: Sync to Ceph QA bucket
      run: |
        set -euo pipefail
        aws s3 sync ./public/ s3://products-qa.aspose.com/ \
          --endpoint-url "$AWS_ENDPOINT_URL" || {
          set +e +o pipefail
          python3 - <<'PY'
        import os, socket, ipaddress
        from urllib.parse import urlparse
        u = urlparse(os.environ.get("AWS_ENDPOINT_URL", ""))
        print("DIAG scheme:", u.scheme or "(none)", "| has_host:", bool(u.hostname), "| port:", u.port or {"https": 443, "http": 80}.get(u.scheme))
        try:
            ips = {i[4][0] for i in socket.getaddrinfo(u.hostname, u.port or (443 if u.scheme == "https" else 80))}
            print("DIAG resolves: True | private:", [ipaddress.ip_address(i).is_private for i in ips])
            try:
                socket.create_connection((sorted(ips)[0], u.port or (443 if u.scheme == "https" else 80)), timeout=8).close()
                print("DIAG tcp_connect: True")
            except Exception as e:
                print("DIAG tcp_connect: False", type(e).__name__)
        except Exception as e:
            print("DIAG resolves: False", type(e).__name__)
        PY
          exit 1; }
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.CEPH_QA_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.CEPH_QA_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-1
        AWS_EC2_METADATA_DISABLED: "true"
        AWS_ENDPOINT_URL: ${{ secrets.CEPH_QA_ENDPOINT_URL }}
